# Builds the Windows installer and portable exe.
# Every push to main (or a v* tag) builds both exes and publishes them, with a build-it-yourself
# zip (with build.bat), as the release for the version in package.json. Can also be run by hand from the Actions tab.
name: Build for Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build installer and portable exe
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Pack the build-it-yourself zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "pack/mxtp" | Out-Null
          Copy-Item -Recurse src, assets, package.json, build.bat, README.md, LICENSE "pack/mxtp/"
          Compress-Archive -Path "pack/mxtp" -DestinationPath "dist/mxtp-build-it-yourself.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mxtp-windows
          path: |
            dist/mxtp-Setup.exe
            dist/mxtp.exe
            dist/mxtp-build-it-yourself.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: mxtp ${{ steps.ver.outputs.tag }}
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/mxtp-Setup.exe
            dist/mxtp.exe
            dist/mxtp-build-it-yourself.zip
