# Builds the Windows installer and portable exe.
# Push a tag like v0.1.0-beta to publish a GitHub release with both exes
# and a build-it-yourself zip (with build.bat). Can also be run by hand from the Actions tab.
name: Build for Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build installer and portable exe
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Pack the build-it-yourself zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "pack/mxtp" | Out-Null
          Copy-Item -Recurse src, assets, package.json, build.bat, README.md, LICENSE "pack/mxtp/"
          Compress-Archive -Path "pack/mxtp" -DestinationPath "dist/mxtp-build-it-yourself.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mxtp-windows
          path: |
            dist/mxtp-Setup.exe
            dist/mxtp.exe
            dist/mxtp-build-it-yourself.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: mxtp ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/mxtp-Setup.exe
            dist/mxtp.exe
            dist/mxtp-build-it-yourself.zip
