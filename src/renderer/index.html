<!DOCTYPE html>
<html lang="en" data-skin="rdio" data-theme="midnight" data-layout="sidebar">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' media: https: http: data: blob:; media-src 'self' media: blob: data:; connect-src 'self' media:">
  <title>mxtp</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="skins.css">
</head>
<body>
  <header id="titlebar">
    <div class="tb-brand" id="brandHome" title="Home">
      <svg class="wordmark" viewBox="-1 -13 182 73" role="img" aria-label="mxtp"><g fill="currentColor"><g><rect x="0" y="0" width="15" height="40" rx="2.6"/><rect x="22.5" y="14.75" width="15" height="25.25" rx="2.6"/><rect x="45" y="14.75" width="15" height="25.25" rx="2.6"/><path d="M7.5 18.75a11.25 11.25 0 0 1 22.5 0" fill="none" stroke="currentColor" stroke-width="15"/><path d="M30 18.75a11.25 11.25 0 0 1 22.5 0" fill="none" stroke="currentColor" stroke-width="15"/></g><g transform="translate(63 0)"><path d="M1.5 0H15.5L38.5 40H24.5z"/><path d="M24.5 0H38.5L15.5 40H1.5z"/></g><g transform="translate(106 0)"><rect x="7" y="-11" width="15" height="51" rx="2.6"/><rect x="0" y="0" width="31" height="13" rx="2.6"/></g><g transform="translate(140 0)"><path d="M0 2.6a2.6 2.6 0 0 1 2.6 -2.6h9.8a2.6 2.6 0 0 1 2.6 2.6V49L0 58z"/><circle cx="20" cy="20" r="12.5" fill="none" stroke="currentColor" stroke-width="15"/></g></g></svg>
    </div>
    <div class="tb-nav">
      <button class="tb-btn" id="navBack" title="Back"></button>
      <button class="tb-btn" id="navFwd" title="Forward"></button>
    </div>
    <label class="tb-search">
      <span class="tb-search-ic"></span>
      <input id="searchInput" type="text" spellcheck="false" placeholder="Search your music">
    </label>
    <div class="tb-spacer"></div>
    <button class="tb-icon" id="openBtn" title="Open files (Ctrl+O)"></button>
    <button class="tb-icon" id="themeBtn" title="Switch theme"></button>
    <button class="tb-icon" id="settingsBtn" title="Settings"></button>
    <button class="tb-icon" id="widgetBtn" title="Mini player"></button>
    
  </header>
  <nav id="tabs"></nav>

  <div id="body">
    <aside id="sidebar">
      <section id="sidePlayer" class="side-player"></section>
      <nav id="nav"></nav>
    </aside>

    <div id="mainWrap">
      <main id="view"></main>
            <section id="nowPlaying" class="now-playing" hidden></section>
    </div>
  </div>

  <footer id="playerBar" class="player-bar"></footer>

  <section id="musicMode" class="music-mode" hidden></section>
  <div id="menu" class="menu" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="icons.js"></script>
  <script src="visualizers.js"></script>
  <script src="app.js"></script>
</body>
</html>
